<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Новое объявление — Барахолка</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="header">
    <div class="container header__bar">
      <a href="index.html" class="logo"><span class="logo__mark">Б</span>Барахолка</a>

      <nav class="main-nav">
        <a href="index.html">Объявления</a>
        <a href="my.html">Мои объявления</a>          <!-- только для авторизованного -->
      </nav>

      <!-- Авторизованный -->
      <div class="header__actions">
        <a href="form.html" class="btn btn-primary btn-sm">+ Разместить</a>
        <span class="header__user">seller@example.com</span>
        <button class="btn btn-outline btn-sm">Выйти</button>
      </div>

      <!-- Гость (вместо блока выше):
      <div class="header__actions">
        <a href="login.html" class="btn btn-outline btn-sm">Войти</a>
        <a href="register.html" class="btn btn-primary btn-sm">Регистрация</a>
      </div>
      -->
    </div>
  </header>

  <main class="container section" style="max-width: 640px">
    <!-- При редактировании: «Редактировать объявление» -->
    <h1 class="section-title">Новое объявление</h1>

    <form class="card" novalidate>
      <!-- Поле с ошибкой: у .field добавляется класс has-error и после поля — p.error-text -->
      <div class="field has-error">
        <label class="required" for="title">Название</label>
        <input type="text" id="title" name="title">
        <p class="error-text">Введите название</p>
      </div>

      <div class="field">
        <label for="description">Описание</label>
        <textarea id="description" name="description" rows="4"></textarea>
      </div>

      <div class="field has-error">
        <label class="required" for="price">Цена, ₽</label>
        <input type="number" id="price" name="price" value="0">
        <p class="error-text">Цена должна быть больше 0</p>
      </div>

      <div class="field">
        <label class="required" for="image">Изображение</label>

        <!-- При редактировании — текущая картинка и подсказка:
        <div class="listing-form__current-image"><img src="img/seed-1.svg" alt="Текущее изображение"></div>
        -->
        <input type="file" id="image" name="image" accept="image/*">
        <!-- <span class="hint">Оставьте пустым, чтобы сохранить текущее изображение</span> -->
      </div>

      <div class="form-actions">
        <button type="submit" class="btn btn-primary">Сохранить</button>
      </div>
    </form>
  </main>
</body>
</html>
